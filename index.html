<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMA Studies</title>
    <meta name="description" content="Two separate design studies for UMA.">
    <meta name="theme-color" content="#060606">
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.07), transparent 28%),
          #060606;
        color: #f4f0ea;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(36rem, calc(100vw - 2rem));
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(2.8rem, 8vw, 5.2rem);
        letter-spacing: 0.08em;
      }

      p {
        margin-top: 0.65rem;
        color: rgba(244, 240, 234, 0.68);
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(244, 240, 234, 0.18);
        padding-bottom: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>UMA</h1>
      <p>Two separate studies.</p>
      <nav>
        <a href="version-a/">Version A / atmospheric</a>
        <a href="version-b/">Version B / editorial</a>
      </nav>
    </main>
  </body>
</html>
